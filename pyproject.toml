[tool.black]
line-length = 88
target-version = ["py310"]
include = '(backtest_data|optimizer_backtest|optimizer_mc|simulation_utils|regime_matching|size_by_beta|test_backtest|test_simulation|plot_results|test_results_chart)\.py$'

[tool.ruff]
line-length = 88
target-version = "py310"
include = [
    "backtest_data.py",
    "optimizer_backtest.py",
    "optimizer_mc.py",
    "simulation_utils.py",
    "regime_matching.py",
    "size_by_beta.py",
    "plot_results.py",
    "tests/test_*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
